<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost Particle — character study</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #cfd8dc; font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; }
  canvas { display: block; }
  .labels { position: fixed; left: 0; right: 0; bottom: 6vh; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; pointer-events: none; }
  .labels div { font-size: clamp(14px, 1.4vw, 20px); letter-spacing: 0.01em; }
  .labels span { display: block; font-size: 0.8em; color: #78909c; margin-top: 0.3em; }
  .note { position: fixed; top: 4vh; left: 0; right: 0; text-align: center; font-size: clamp(12px, 1.1vw, 16px); color: #78909c; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js" } }
</script>
</head>
<body>
<div class="note">Ghost Particle character study. Electron flavor tint, neutral pose. Press 1, 2 or 3 to switch flavor. Space toggles a slow turn.</div>
<div class="labels">
  <div>Sheet ghost<span>dome and skirt, dark visor, glowing eyes</span></div>
  <div>Bubble<span>lit from inside, toy eyes, antenna</span></div>
  <div>Wisp<span>teardrop with a tail, glowing dot eyes, motes</span></div>
</div>
<script type="module">
import * as THREE from 'three';

const TINTS = { electron: 0x4FC3F7, muon: 0xB388FF, tau: 0xFF8A65 };
let tint = new THREE.Color(TINTS.electron);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.4, 12);
camera.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0x8fbfff, 0x101820, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.4); rim.position.set(-4, 2, -3); scene.add(rim);

// Shared material helpers -------------------------------------------------
const bodyMat = (opacity = 0.55, rough = 0.25) => { const m = new THREE.MeshPhysicalMaterial({
  color: tint.clone(), transparent: true, opacity, roughness: rough, metalness: 0,
  clearcoat: 1, clearcoatRoughness: 0.15, emissive: tint.clone(), emissiveIntensity: 0.12,
  depthWrite: false, side: THREE.FrontSide,
}); tinted.push(m); return m; };
// Fake fresnel glow: slightly larger back-face shell, additive.
const rimMat = (strength = 0.35) => { const m = new THREE.MeshBasicMaterial({
  color: tint.clone(), transparent: true, opacity: strength, blending: THREE.AdditiveBlending,
  side: THREE.BackSide, depthWrite: false,
}); tinted.push(m); return m; };
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
const tinted = [];
const glowSprite = (size, opacity) => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128,128,0,128,128,128);
  grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.35, 'rgba(255,255,255,0.35)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0,0,256,256);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), color: tint.clone(), transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
  tinted.push(s.material); s.scale.setScalar(size); return s;
};
const eyeGlow = (w, h, depth = 0) => {
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(w, h, 4, 12), new THREE.MeshBasicMaterial({ color: 0xE3F6FF }));
  m.rotation.z = Math.PI / 2 * 0; m.position.z = depth; return m;
};

// 1. Sheet ghost ----------------------------------------------------------
function sheetGhost() {
  const g = new THREE.Group();
  // Lathe profile: dome to a scalloped skirt.
  const pts = [];
  const N = 40;
  for (let i = 0; i <= N; i++) {
    const t = i / N;                       // 0 top → 1 bottom
    const y = 1.1 - t * 2.1;
    let r = Math.sqrt(Math.max(0, 1 - Math.pow((y - 0.1) / 1.0, 2))) * 1.0;
    if (y < 0.1) r = 1.0 - 0.06 * ((0.1 - y) / 1.2) ** 2 * 3;   // gentle taper down the skirt
    pts.push(new THREE.Vector2(Math.max(0.001, r), y));
  }
  const geo = new THREE.LatheGeometry(pts, 64);
  // Scallop the hem by displacing bottom ring vertices.
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    if (y < -0.7) {
      const x = pos.getX(i), z = pos.getZ(i);
      const ang = Math.atan2(z, x);
      const scallop = 0.16 * Math.abs(Math.sin(ang * 3)) * ((-0.7 - y) / 0.3);
      pos.setY(i, y + scallop);
    }
  }
  geo.computeVertexNormals();
  const body = new THREE.Mesh(geo, bodyMat(0.42, 0.2)); g.add(body);
  const shell = new THREE.Mesh(geo, rimMat(0.34)); shell.scale.setScalar(1.035); g.add(shell);
  // Dark visor band across the face.
  const visor = new THREE.Mesh(new THREE.SphereGeometry(1.0, 64, 32, Math.PI * 0.12, Math.PI * 0.76, Math.PI * 0.30, Math.PI * 0.22),
    new THREE.MeshPhysicalMaterial({ color: 0x0b1220, roughness: 0.25, clearcoat: 1, transparent: true, opacity: 0.9, depthWrite: false }));
  visor.position.y = 0.1; visor.scale.setScalar(0.985); g.add(visor);
  // Eyes: two soft vertical capsules of light on the visor.
  for (const sx of [-0.3, 0.3]) {
    const e = eyeGlow(0.07, 0.16); e.position.set(sx, 0.36, 0.9); e.rotation.y = sx > 0 ? -0.3 : 0.3; g.add(e);
    const s = glowSprite(0.7, 0.5); s.position.set(sx, 0.36, 1.0); g.add(s);
  }
  g.add(at(glowSprite(4.2, 0.28), 0, 0, -0.5));
  return g;
}

// 2. Bubble ----------------------------------------------------------------
function bubble() {
  const g = new THREE.Group();
  const geo = new THREE.SphereGeometry(1.05, 64, 48);
  const body = new THREE.Mesh(geo, bodyMat(0.36, 0.12)); body.scale.set(1.08, 0.94, 1); g.add(body);
  const shell = new THREE.Mesh(geo, rimMat(0.32)); shell.scale.set(1.12, 0.98, 1.04); g.add(shell);
  // Inner core: the light inside the bubble.
  g.add(at(glowSprite(1.4, 0.9), 0, 0.0, -0.35));
  g.add(at(glowSprite(3.0, 0.4), 0, 0.0, -0.35));
  // Toy eyes: white with dark pupil and a highlight.
  for (const sx of [-0.36, 0.36]) {
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 24), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.25, clearcoat: 1 }));
    white.position.set(sx, 0.2, 0.95); white.scale.set(1, 1.25, 0.6); g.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 16), new THREE.MeshBasicMaterial({ color: 0x0b1220 }));
    pupil.position.set(sx + (sx > 0 ? -0.02 : 0.02), 0.2, 1.08); pupil.scale.set(1, 1.3, 0.6); g.add(pupil);
    const hi = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    hi.position.set(sx + 0.035, 0.28, 1.14); g.add(hi);
  }
  // Antenna nub.
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.35, 12), bodyMat(0.9, 0.3));
  stem.position.set(0.2, 1.15, 0); stem.rotation.z = -0.25; g.add(stem);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  tip.position.set(0.24, 1.32, 0); g.add(tip);
  g.add(at(glowSprite(0.6, 0.8), 0.24, 1.32, 0));
  g.add(at(glowSprite(4.4, 0.25), 0, 0, -0.6));
  return g;
}

// 3. Wisp ------------------------------------------------------------------
function wisp() {
  const g = new THREE.Group();
  // Teardrop: sphere top tapering to a curled tail (lathe).
  const pts = [];
  const N = 48;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const y = 1.0 - t * 2.4;
    let r;
    if (y > -0.1) r = Math.sqrt(Math.max(0, 1 - Math.pow((y - 0.1) / 0.9, 2))) * 0.9;
    else r = Math.max(0.02, 0.85 * Math.pow((y + 1.4) / 1.3, 2.2));
    pts.push(new THREE.Vector2(Math.max(0.001, r), y));
  }
  const geo = new THREE.LatheGeometry(pts, 64);
  // Curl the tail sideways.
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    if (y < -0.1) { const k = (-0.1 - y) / 1.3; pos.setZ(i, pos.getZ(i) - 0.9 * k * k); }
  }
  geo.computeVertexNormals();
  const outer = new THREE.Mesh(geo, bodyMat(0.4, 0.35)); g.add(outer);
  const heart = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 }));
  heart.position.set(0, -0.05, -0.3); g.add(heart);
  const shell = new THREE.Mesh(geo, rimMat(0.3)); shell.scale.setScalar(1.04); g.add(shell);
  g.add(at(glowSprite(1.8, 0.6), 0, -0.05, -0.3));
  // Eyes as two glowing arcs (happy squint, but neutral: shallow arcs).
  for (const sx of [-0.3, 0.3]) {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.11, 24, 16), new THREE.MeshBasicMaterial({ color: 0xE3F6FF }));
    dot.position.set(sx, 0.3, 0.84); dot.scale.set(1, 1.15, 0.5); g.add(dot);
    const s = glowSprite(0.7, 0.5); s.position.set(sx, 0.3, 0.9); g.add(s);
  }
  // Motes.
  const moteGeo = new THREE.SphereGeometry(0.045, 8, 6);
  const moteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const motes = [[1.1, 0.7, 0.2, 0.045], [-1.05, 0.3, -0.3, 0.035], [0.7, -1.1, 0.4, 0.03], [-0.6, 1.15, 0.1, 0.03], [1.3, -0.4, -0.2, 0.025]];
  for (const [x, y, z, r] of motes) {
    const m = new THREE.Mesh(moteGeo, moteMat); m.position.set(x, y, z); m.scale.setScalar(r / 0.045); g.add(m);
    const s = glowSprite(0.45 * (r / 0.045), 0.7); s.position.set(x, y, z); g.add(s);
  }
  g.add(at(glowSprite(4.2, 0.24), 0, 0, -0.6));
  return g;
}

const figures = [sheetGhost(), bubble(), wisp()];
const spacing = 3.9;
figures.forEach((f, i) => { f.position.x = (i - 1) * spacing; scene.add(f); });

// Interaction: 1/2/3 flavor tint, Space slow turn.
let turning = false;
addEventListener('keydown', (e) => {
  const map = { '1': 'electron', '2': 'muon', '3': 'tau' };
  if (map[e.key]) { tint.set(TINTS[map[e.key]]); for (const m of tinted) { m.color.copy(tint); if (m.emissive) m.emissive.copy(tint); } }
  if (e.key === ' ') turning = !turning;
});

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

function frame(t) {
  if (turning) figures.forEach(f => f.rotation.y = Math.sin(t * 0.0004) * 0.5);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__ready = true;
</script>
</body>
</html>
