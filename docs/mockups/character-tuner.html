<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #cfd8dc; font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .note { position: fixed; top: 14px; left: 16px; font-size: 13px; color: #78909c; pointer-events: none; max-width: 40ch; line-height: 1.4; }
  #out { position: fixed; left: 16px; bottom: 16px; width: 44ch; height: 20vh; background: #05080c; color: #b0bec5; border: 1px solid #1b2730; border-radius: 10px; padding: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace; resize: vertical; }
  #out:focus { outline: 1px solid #00E5FF; }
  .lil-gui { --width: 300px; --font-family: inherit; }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",

<body>
<div class="note">Character tuner. Ink-eye bubble with bloom and glow tools. Every change updates the JSON below; copy it and paste it back as the final decision. Settings persist in this browser. Drag to orbit.</div>
<textarea id="out" spellcheck="false" readonly></textarea>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---- mirror of src/character/reactions.ts, types stripped; keep the two in step ----

const IDLE = {
  scaleX: 1, scaleY: 1, offsetX: 0, offsetY: 0, rotZ: 0, rotY: 0,
  squint: 0, lowerLid: 0, eyeWidth: 1, eyeTall: 1,
  eyeShiftX: 0, eyeShiftY: 0, eyeTilt: 0, leftEye: 1, rightEye: 1,
};

const CHANNELS = Object.keys(IDLE);

const EASES = {
  linear: (x) => x,
  in: (x) => x * x,
  out: (x) => 1 - (1 - x) * (1 - x),
  inOut: (x) => 0.5 - Math.cos(Math.PI * x) / 2,
  back: (x) => 1 + 2.7 * (x - 1) ** 3 + 1.7 * (x - 1) ** 2,
};

const REACTIONS = {
  // Squash flat and squeeze the eyes shut, expecting an impact that never comes.
  brace: [
    { t: 0 },
    { t: 0.12, scaleX: 1.2, scaleY: 0.7, offsetY: -0.11, squint: 0.86, eyeWidth: 1.12, ease: 'out' },
    { t: 0.44, scaleX: 1.22, scaleY: 0.68, offsetY: -0.12, squint: 0.9, eyeWidth: 1.12, ease: 'inOut' },
    { t: 0.78, scaleX: 1, scaleY: 1, offsetY: 0, squint: 0.2, ease: 'out' },
    { t: 0.95, ease: 'back' },
  ],
  // Pop back to round (the body's own squash undone) with the eyes wide.
  surprised: [
    { t: 0 },
    { t: 0.09, scaleX: 1.06, scaleY: 0.9, offsetY: -0.04, ease: 'out' },
    { t: 0.26, scaleX: 0.94, scaleY: 1.1, offsetY: 0.07, eyeWidth: 1.35, eyeTall: 1.35, ease: 'back' },
    { t: 0.6, scaleX: 0.95, scaleY: 1.07, offsetY: 0.05, eyeWidth: 1.3, eyeTall: 1.3, ease: 'inOut' },
    { t: 0.92, ease: 'out' },
  ],
  // Crouch, launch with a stretch, land with a squash; the lower lids ride up into arcs.
  cheer: [
    { t: 0 },
    { t: 0.11, scaleX: 1.14, scaleY: 0.84, offsetY: -0.08, ease: 'out' },
    { t: 0.36, scaleX: 0.88, scaleY: 1.18, offsetY: 0.3, lowerLid: 0.55, ease: 'out' },
    { t: 0.64, scaleX: 1, scaleY: 1, offsetY: 0, lowerLid: 0.5, ease: 'in' },
    { t: 0.75, scaleX: 1.16, scaleY: 0.86, offsetY: -0.06, lowerLid: 0.5, ease: 'out' },
    { t: 1, scaleX: 1, scaleY: 1.02, offsetY: 0.02, lowerLid: 0.42, ease: 'back' },
    { t: 1.3, ease: 'inOut' },
  ],
  // Two dips, each with a little squash, and a soft lid drop for warmth.
  nod: [
    { t: 0 },
    { t: 0.18, offsetY: -0.17, scaleX: 1.05, scaleY: 0.92, squint: 0.16, ease: 'inOut' },
    { t: 0.36, offsetY: 0.04, scaleX: 0.99, scaleY: 1.03, squint: 0.08, ease: 'inOut' },
    { t: 0.54, offsetY: -0.17, scaleX: 1.05, scaleY: 0.92, squint: 0.16, ease: 'inOut' },
    { t: 0.72, offsetY: 0.03, scaleX: 0.99, scaleY: 1.02, squint: 0.06, ease: 'inOut' },
    { t: 0.88, ease: 'inOut' },
  ],
  // Rise, flatten the eyes to lines for a beat, settle back down.
  shrug: [
    { t: 0 },
    { t: 0.24, offsetY: 0.15, scaleX: 0.97, scaleY: 1.06, eyeTall: 0.3, eyeWidth: 1.08, ease: 'out' },
    { t: 0.5, offsetY: 0.17, scaleX: 0.97, scaleY: 1.05, eyeTall: 0.11, eyeWidth: 1.12, ease: 'inOut' },
    { t: 0.82, offsetY: 0.16, scaleX: 0.97, scaleY: 1.05, eyeTall: 0.11, eyeWidth: 1.12, ease: 'linear' },
    { t: 1.15, ease: 'inOut' },
  ],
  // Lean toward the thing being looked at; the near eye opens larger than the far one.
  peek: [
    { t: 0 },
    { t: 0.26, rotZ: -0.2, offsetX: 0.16, eyeShiftX: 0.012, leftEye: 1.22, rightEye: 0.86, ease: 'out' },
    { t: 0.72, rotZ: -0.23, offsetX: 0.19, eyeShiftX: 0.014, leftEye: 1.28, rightEye: 0.84, ease: 'inOut' },
    { t: 1.1, ease: 'inOut' },
  ],
  // The eyes travel down the face to look at the body, with a small dip to match.
  'look-at-self': [
    { t: 0 },
    { t: 0.3, eyeShiftY: 0.06, squint: 0.16, offsetY: -0.03, scaleY: 0.98, scaleX: 1.02, ease: 'out' },
    { t: 0.8, eyeShiftY: 0.08, squint: 0.2, offsetY: -0.04, scaleY: 0.98, scaleX: 1.02, ease: 'inOut' },
    { t: 1.15, ease: 'inOut' },
  ],
  // Puff up and ride one slow swell with the eyes content and half shut.
  proud: [
    { t: 0 },
    { t: 0.45, offsetY: 0.1, scaleX: 1.04, scaleY: 1.05, squint: 0.42, ease: 'inOut' },
    { t: 0.95, offsetY: 0.13, scaleX: 1.05, scaleY: 1.06, squint: 0.48, ease: 'inOut' },
    { t: 1.45, offsetY: 0.02, scaleX: 1.01, scaleY: 1.01, squint: 0.3, ease: 'inOut' },
    { t: 1.75, ease: 'inOut' },
  ],
  // Lean in and rock, smiling with the lower lids up: a whole-body goodbye.
  wave: [
    { t: 0 },
    { t: 0.2, rotZ: -0.26, offsetX: 0.11, lowerLid: 0.3, ease: 'out' },
    { t: 0.44, rotZ: 0.22, offsetX: -0.09, lowerLid: 0.36, ease: 'inOut' },
    { t: 0.66, rotZ: -0.24, offsetX: 0.1, lowerLid: 0.36, ease: 'inOut' },
    { t: 0.88, rotZ: 0.18, offsetX: -0.07, lowerLid: 0.34, ease: 'inOut' },
    { t: 1.12, rotZ: -0.1, offsetX: 0.04, lowerLid: 0.28, ease: 'inOut' },
    { t: 1.4, ease: 'inOut' },
  ],
  // Start shut, blink open with one settling blink, then turn to look left and right.
  wake: [
    { t: 0, squint: 1, scaleX: 1.05, scaleY: 0.93 },
    { t: 0.3, squint: 0.97, scaleX: 1.03, scaleY: 0.95, ease: 'inOut' },
    { t: 0.52, squint: 0, scaleX: 0.98, scaleY: 1.04, ease: 'out' },
    { t: 0.66, squint: 0.55, ease: 'in' },
    { t: 0.8, squint: 0, ease: 'out' },
    { t: 1.2, rotY: -0.2, eyeShiftX: -0.015, ease: 'inOut' },
    { t: 1.68, rotY: 0.2, eyeShiftX: 0.015, ease: 'inOut' },
    { t: 2.05, ease: 'inOut' },
  ],
};

const NAMES = [
  'wake', 'wiggle', 'nod', 'shrug', 'brace', 'surprised',
  'look-at-self', 'cheer', 'proud', 'peek', 'wave',
];

function fillPose(k) {
  const p = { ...IDLE };
  for (const c of CHANNELS) { const v = k[c]; if (v !== undefined) p[c] = v; }
  return p;
}

function poseAt(track, time) {
  if (track.length === 0) return { ...IDLE };
  let i = 0;
  while (i < track.length - 1 && time >= track[i + 1].t) i++;
  if (i === track.length - 1) return fillPose(track[i]);
  const a = fillPose(track[i]);
  const b = fillPose(track[i + 1]);
  const span = track[i + 1].t - track[i].t;
  const x = span > 0 ? (time - track[i].t) / span : 1;
  const k = EASES[track[i + 1].ease ?? 'inOut'](Math.min(1, Math.max(0, x)));
  const out = { ...IDLE };
  for (const c of CHANNELS) out[c] = a[c] + (b[c] - a[c]) * k;
  return out;
}

function createReactionPlayer() {
  let track = null;
  let name = null;
  let time = 0;
  return {
    play(n) {
      const t = REACTIONS[n];
      if (!t || t.length === 0) return;
      track = t; name = n; time = 0;
    },
    update(dt) {
      if (!track) return { ...IDLE };
      time += dt;
      if (time >= track[track.length - 1].t) { track = null; name = null; return { ...IDLE }; }
      return poseAt(track, time);
    },
    get playing() { return name; },
  };
}

const clamp01 = (v) => Math.min(1, Math.max(0, v));

// The pose channels that are eye-texture settings; eyeShiftX and the per-eye sizes are read
// straight from the pose by the skin painter.
function eyesWithPose(base, p) {
  return {
    ...base,
    height: base.height + p.eyeShiftY,
    width: base.width * p.eyeWidth,
    tall: base.tall * p.eyeTall,
    tilt: base.tilt + p.eyeTilt,
    squint: clamp01(base.squint + p.squint),
    lowerLid: clamp01(base.lowerLid + p.lowerLid),
  };
}

// ---- end mirror ----

const TINTS = { electron: '#00E5FF', muon: '#B026FF', tau: '#FF5C00' };

const defaults = {
  flavor: 'electron',
  body: { scaleX: 1.06, scaleY: 0.96, colorDepth: 1.0, opacity: 0.85, roughness: 0.22, clearcoat: 0.6, clearcoatRoughness: 0.1, sheen: 0.1, sheenColor: '#ffffff', emissiveBoost: 0.35 },
  eyes: { spacing: 0.062, height: 0.42, width: 30, tall: 48, tilt: 0, color: '#0b1a26', roughness: 0.88, highlight: true, hlSize: 9, hlTall: 12, hlOffsetX: 9, hlOffsetY: -16, hlColor: '#ffffff', squint: 0, lowerLid: 0 },
  light: { keyIntensity: 1.2, keyX: 3, keyY: 6, keyZ: 5, fillIntensity: 0.25, fillColor: '#9fd8ff', rimIntensity: 1.0, rimX: -3, rimY: 3, rimZ: -5, envIntensity: 0.3, exposure: 1.0 },
  post: { bloom: true, bloomThreshold: 0.8, bloomStrength: 0.35, bloomRadius: 0.4, eyeGlow: 0.0, rimShell: false, rimOpacity: 0.3, rimScale: 1.035, halo: false, haloSize: 3.5, haloOpacity: 0.3 },
  view: { turn: false, idleBob: false },
};
const saved = localStorage.getItem('ghost-particle-tuner');
const S = saved ? deepMerge(structuredClone(defaults), JSON.parse(saved)) : structuredClone(defaults);
function deepMerge(a, b) { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) a[k] = deepMerge(a[k] || {}, b[k]); else a[k] = b[k]; } return a; }

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.3, 6.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 3; controls.maxDistance = 12;

const key = new THREE.DirectionalLight(0xffffff, 1); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 1); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1); scene.add(rim);

// Skin textures. Front of the sphere is u = 0.25, equator v = 0.5; near the equator a canvas
// circle is a sphere circle. One canvas per channel, repainted in place as a reaction plays.
const W = 1024, H = 512;
const scaleHex = (hex, k) => { const c = new THREE.Color(hex); return '#' + c.multiplyScalar(k).getHexString(); };
const greyHex = (v) => { const h = Math.round(clamp01(v) * 255).toString(16).padStart(2, '0'); return '#' + h + h + h; };
const skins = {};
for (const kind of ['map', 'rough', 'emissive']) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const t = new THREE.CanvasTexture(c);
  if (kind !== 'rough') t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  skins[kind] = { ctx: c.getContext('2d'), tex: t };
}
function paintSkin(kind, e, p) {
  const g = skins[kind].ctx, tint = TINTS[S.flavor];
  g.fillStyle = kind === 'map' ? tint : kind === 'emissive' ? scaleHex(tint, S.body.emissiveBoost) : greyHex(S.body.roughness);
  g.fillRect(0, 0, W, H);
  const y = e.height * H, xs = [(0.25 + p.eyeShiftX - e.spacing) * W, (0.25 + p.eyeShiftX + e.spacing) * W];
  xs.forEach((x, i) => {
    const side = i === 0 ? -1 : 1, k = i === 0 ? p.leftEye : p.rightEye;
    const w = e.width * k, tall = e.tall * k;
    g.save(); g.translate(x, y); g.rotate(side * e.tilt);
    // Lids clip the eye: squint eats it from the top, lowerLid from the bottom (the cheer arc).
    const lid = e.squint * tall * 2, lower = e.lowerLid * tall * 2;
    g.beginPath(); g.rect(-w * 2, -tall - 2 + lid, w * 4, tall * 2 + 4 - lid - lower); g.clip();
    g.fillStyle = kind === 'map' ? e.color : kind === 'emissive' ? '#000000' : greyHex(e.roughness);
    g.beginPath(); g.ellipse(0, 0, w, tall, 0, 0, Math.PI * 2); g.fill();
    if (e.highlight && (kind === 'map' || kind === 'emissive')) {
      g.fillStyle = kind === 'map' ? e.hlColor : scaleHex(e.hlColor, S.post.eyeGlow);
      g.beginPath(); g.ellipse(e.hlOffsetX * k, e.hlOffsetY * k, e.hlSize * k, e.hlTall * k, 0, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  });
  skins[kind].tex.needsUpdate = true;
}
let drawn = '';
function drawSkins(p) {
  const e = eyesWithPose(S.eyes, p);
  const sig = [e.height, e.width, e.tall, e.tilt, e.squint, e.lowerLid, p.eyeShiftX, p.leftEye, p.rightEye].join();
  if (sig === drawn) return;
  drawn = sig;
  paintSkin('map', e, p); paintSkin('rough', e, p); paintSkin('emissive', e, p);
}

const player = createReactionPlayer();
let pose = { ...IDLE };
function react(name) { player.play(name); }
window.ghost = { react };

const geo = new THREE.SphereGeometry(1, 128, 96);
const mat = new THREE.MeshPhysicalMaterial({ transparent: true, metalness: 0, roughness: 1, emissive: new THREE.Color(0x000000) });
const body = new THREE.Mesh(geo, mat); scene.add(body);
const rimMat = new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false });
const rimShell = new THREE.Mesh(geo, rimMat); body.add(rimShell);
const haloTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const gr = g.createRadialGradient(128,128,0,128,128,128); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.35,'rgba(255,255,255,0.35)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,256,256); return new THREE.CanvasTexture(c); })();
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
halo.position.z = -0.6; body.add(halo);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.25, 0.3, 0.95);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

function apply() {
  const b = S.body, l = S.light, tint = TINTS[S.flavor];
  mat.map = skins.map.tex; mat.roughnessMap = skins.rough.tex; mat.emissiveMap = skins.emissive.tex;
  mat.color.set('#ffffff').lerp(new THREE.Color(tint), b.colorDepth);
  mat.opacity = b.opacity; mat.clearcoat = b.clearcoat; mat.clearcoatRoughness = b.clearcoatRoughness;
  mat.sheen = b.sheen; mat.sheenColor.set(b.sheenColor);
  mat.emissive.set('#ffffff'); mat.emissiveIntensity = 1;
  mat.needsUpdate = true;
  drawn = ''; drawSkins(pose);
  const p = S.post;
  bloomPass.enabled = p.bloom; bloomPass.threshold = p.bloomThreshold; bloomPass.strength = p.bloomStrength; bloomPass.radius = p.bloomRadius;
  rimShell.visible = p.rimShell; rimMat.color.set(tint); rimMat.opacity = p.rimOpacity; rimShell.scale.setScalar(p.rimScale);
  halo.visible = p.halo; halo.material.color.set(tint); halo.material.opacity = p.haloOpacity; halo.scale.setScalar(p.haloSize);
  key.intensity = l.keyIntensity; key.position.set(l.keyX, l.keyY, l.keyZ);
  fill.intensity = l.fillIntensity; fill.color.set(l.fillColor); fill.position.set(-5, 1, 3);
  rim.intensity = l.rimIntensity; rim.position.set(l.rimX, l.rimY, l.rimZ);
  scene.environmentIntensity = l.envIntensity;
  renderer.toneMappingExposure = l.exposure;
  const out = document.getElementById('out');
  out.value = JSON.stringify(S, null, 2);
  localStorage.setItem('ghost-particle-tuner', JSON.stringify(S));
}

const gui = new GUI({ title: 'Ghost Particle tuner' });
gui.add(S, 'flavor', Object.keys(TINTS)).onChange(apply);
const fr = gui.addFolder('reactions');
for (const name of NAMES) fr.add({ [name]: () => react(name) }, name);
const fb = gui.addFolder('Body');
fb.add(S.body, 'scaleX', 0.8, 1.3, 0.01).name('width').onChange(apply);
fb.add(S.body, 'scaleY', 0.7, 1.2, 0.01).name('height').onChange(apply);
fb.add(S.body, 'colorDepth', 0, 1, 0.01).name('color depth').onChange(apply);
fb.add(S.body, 'opacity', 0.2, 1, 0.01).onChange(apply);
fb.add(S.body, 'roughness', 0, 1, 0.01).onChange(apply);
fb.add(S.body, 'clearcoat', 0, 1, 0.01).onChange(apply);
fb.add(S.body, 'clearcoatRoughness', 0, 1, 0.01).name('clearcoat roughness').onChange(apply);
fb.add(S.body, 'sheen', 0, 1, 0.01).onChange(apply);
fb.addColor(S.body, 'sheenColor').name('sheen color').onChange(apply);
fb.add(S.body, 'emissiveBoost', 0, 1, 0.01).name('inner glow').onChange(apply);
const fe = gui.addFolder('Eyes');
fe.add(S.eyes, 'spacing', 0.02, 0.12, 0.001).onChange(apply);
fe.add(S.eyes, 'height', 0.3, 0.6, 0.005).name('height on face').onChange(apply);
fe.add(S.eyes, 'width', 6, 70, 1).onChange(apply);
fe.add(S.eyes, 'tall', 6, 90, 1).name('tallness').onChange(apply);
fe.add(S.eyes, 'tilt', -0.6, 0.6, 0.01).onChange(apply);
fe.add(S.eyes, 'squint', 0, 1, 0.01).name('upper lid (0 open, 1 shut)').onChange(apply);
fe.add(S.eyes, 'lowerLid', 0, 1, 0.01).name('lower lid (cheer arcs)').onChange(apply);
fe.addColor(S.eyes, 'color').onChange(apply);
fe.add(S.eyes, 'roughness', 0, 1, 0.01).name('eye matte').onChange(apply);
fe.add(S.eyes, 'highlight').onChange(apply);
fe.add(S.eyes, 'hlSize', 1, 30, 1).name('highlight width').onChange(apply);
fe.add(S.eyes, 'hlTall', 1, 40, 1).name('highlight tallness').onChange(apply);
fe.add(S.eyes, 'hlOffsetX', -30, 30, 1).name('highlight x').onChange(apply);
fe.add(S.eyes, 'hlOffsetY', -40, 40, 1).name('highlight y').onChange(apply);
fe.addColor(S.eyes, 'hlColor').name('highlight color').onChange(apply);
const fl = gui.addFolder('Light');
fl.add(S.light, 'keyIntensity', 0, 5, 0.05).name('key').onChange(apply);
fl.add(S.light, 'keyX', -10, 10, 0.1).name('key x').onChange(apply);
fl.add(S.light, 'keyY', -10, 10, 0.1).name('key y').onChange(apply);
fl.add(S.light, 'keyZ', -10, 10, 0.1).name('key z').onChange(apply);
fl.add(S.light, 'fillIntensity', 0, 3, 0.05).name('fill').onChange(apply);
fl.addColor(S.light, 'fillColor').name('fill color').onChange(apply);
fl.add(S.light, 'rimIntensity', 0, 5, 0.05).name('rim').onChange(apply);
fl.add(S.light, 'rimX', -10, 10, 0.1).name('rim x').onChange(apply);
fl.add(S.light, 'rimY', -10, 10, 0.1).name('rim y').onChange(apply);
fl.add(S.light, 'rimZ', -10, 10, 0.1).name('rim z').onChange(apply);
fl.add(S.light, 'envIntensity', 0, 2, 0.01).name('environment').onChange(apply);
fl.add(S.light, 'exposure', 0.2, 3, 0.01).onChange(apply);
const fp = gui.addFolder('Post-processing and glow');
fp.add(S.post, 'bloom').onChange(apply);
fp.add(S.post, 'bloomThreshold', 0, 1, 0.01).name('bloom threshold').onChange(apply);
fp.add(S.post, 'bloomStrength', 0, 3, 0.01).name('bloom strength').onChange(apply);
fp.add(S.post, 'bloomRadius', 0, 1, 0.01).name('bloom radius').onChange(apply);
fp.add(S.post, 'eyeGlow', 0, 4, 0.05).name('eye highlight glow').onChange(apply);
fp.add(S.post, 'rimShell').name('rim shell').onChange(apply);
fp.add(S.post, 'rimOpacity', 0, 1, 0.01).name('rim opacity').onChange(apply);
fp.add(S.post, 'rimScale', 1.0, 1.15, 0.001).name('rim scale').onChange(apply);
fp.add(S.post, 'halo').onChange(apply);
fp.add(S.post, 'haloSize', 1, 8, 0.1).name('halo size').onChange(apply);
fp.add(S.post, 'haloOpacity', 0, 1, 0.01).name('halo opacity').onChange(apply);
const fv = gui.addFolder('View');
fv.add(S.view, 'turn').name('slow turn');
fv.add(S.view, 'idleBob').name('idle bob');
gui.add({ reset() { localStorage.removeItem('ghost-particle-tuner'); location.reload(); } }, 'reset').name('reset to defaults');
gui.add({ copy() { navigator.clipboard?.writeText(document.getElementById('out').value); } }, 'copy').name('copy settings');
apply();

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });

let last = 0;
function frame(t) {
  const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
  last = t;
  controls.update();
  pose = player.update(dt);
  drawSkins(pose);
  const bob = S.view.idleBob ? 1 + Math.sin(t * 0.002) * 0.02 : 1;
  body.scale.set(S.body.scaleX * pose.scaleX * bob, S.body.scaleY * pose.scaleY / bob, 1);
  body.position.set(pose.offsetX, (S.view.idleBob ? Math.sin(t * 0.002) * 0.05 : 0) + pose.offsetY, 0);
  body.rotation.set(0, (S.view.turn ? Math.sin(t * 0.0004) * 0.6 : 0) + pose.rotY, pose.rotZ);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
